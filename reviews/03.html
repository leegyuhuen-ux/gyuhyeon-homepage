<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>제목을 입력하세요 | 이규현</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600&family=Pretendard:wght@300;400;500&display=swap');

:root {
  --bg: #fafaf8;
  --ink: #1a1a1a;
  --muted: #767671;
  --line: #e4e2dc;
  --accent: #8a7d63;
  --max-width: 680px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}

main {
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 4rem 2rem 6rem;
}

.back-link {
  display: inline-block;
  font-size: 0.9rem;
  color: var(--muted);
  text-decoration: none;
  margin-bottom: 3rem;
}

.back-link:hover { color: var(--accent); }

.post-eyebrow {
  font-size: 0.85rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 1rem;
}

.post-title {
  font-family: 'Noto Serif KR', serif;
  font-weight: 600;
  font-size: clamp(1.8rem, 5vw, 2.6rem);
  letter-spacing: -0.01em;
  margin-bottom: 0.5rem;
}

.post-date {
  color: var(--muted);
  font-size: 0.9rem;
  margin-bottom: 3rem;
}

.post-body {
  font-family: 'Noto Serif KR', serif;
  font-weight: 300;
  font-size: 1.15rem;
  line-height: 2;
}

.post-body p {
  margin-bottom: 1.5rem;
}
</style>
</head>
<body>

  <main>
    <a class="back-link" href="../index.html#reviews">&larr; 목록으로</a>

    <p class="post-eyebrow">후기 · 2026</p>
    <h1 class="post-title">제목을 입력하세요</h1>
    <p class="post-date">2026</p>

    <div class="post-body">
      <!-- TODO: 여기에 실제 글 내용을 붙여넣으세요. 문단마다 <p>...</p>로 감싸주세요. -->
      <p>여기에 글 내용을 입력하세요.</p>
    </div>
  </main>

</body>
</html>
